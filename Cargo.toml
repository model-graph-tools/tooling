[package]
name = "mgt"
version = "0.0.0"
authors = ["Harald Pehl <harald.pehl@gmail.com>"]
edition = "2024"
description = "Command line tool to analyze the WildFly management model."
readme = "README.md"
homepage = "https://model-graph-tools.github.io/"
repository = "https://github.com/model-graph-tools/tooling"
license = "Apache-2.0"
keywords = ["WildFly", "management", "model", "graph"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["cargo"] }
clap_complete = { version = "4.6.3", features = ["unstable-dynamic"] }
comfy-table = "7.2.2"
console = "0.16.3"
handlebars = "6.4.0"
indicatif = { version = "0.18.4", features = ["rayon"] }
lazy_static = "1.5.0"
regex = "1.12.3"
reqwest = "0.13.3"
semver = "1.0.28"
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["full"] }
webbrowser = "1.2.1"
which = "8.0.2"
wado = "0.4.12"
wildfly_container_versions = "39.0.5"

# use LTO for smaller binaries (that take longer to build)
[profile.release]
lto = true

[[bin]]
name = "mgt"
